name: greenplan-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-greenplan}
      POSTGRES_USER: ${POSTGRES_USER:-greenplan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-greenplan_dev_only}
    ports:
      - "${POSTGRES_PORT:-35483}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgis:
    image: postgis/postgis:16-3.5-alpine
    shm_size: 256mb
    environment:
      POSTGRES_DB: ${POSTGIS_DB:-greenplan_domain}
      POSTGRES_USER: ${POSTGIS_USER:-greenplan_domain}
      POSTGRES_PASSWORD: ${POSTGIS_PASSWORD:-greenplan_domain_dev_only}
    ports:
      - "${POSTGIS_PORT:-36483}:5432"
    volumes:
      - ./data/postgis:/var/lib/postgresql/data
      - ./db/postgis-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      GREENPLAN_DATA_MODE: postgis
      GREENPLAN_DATABASE_URL: postgresql://${POSTGIS_USER:-greenplan_domain}:${POSTGIS_PASSWORD:-greenplan_domain_dev_only}@postgis:5432/${POSTGIS_DB:-greenplan_domain}
      GREENPLAN_INTAKE_ROOT: /intake
      CELERY_BROKER_URL: redis://redis:6379/0
      LAYA_URL: ${LAYA_URL:-}
      SEMANTIC_LAYA_URL: http://laya:8000
      LAYA_API_KEY: ${LAYA_API_KEY:-}
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ./data/intake:/intake
    ports:
      - "${API_PORT:-38100}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy

  domain-import:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    profiles: ["tools"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      GREENPLAN_DATABASE_URL: postgresql://${POSTGIS_USER:-greenplan_domain}:${POSTGIS_PASSWORD:-greenplan_domain_dev_only}@postgis:5432/${POSTGIS_DB:-greenplan_domain}
      DATASET_ROOT: /dataset/Пилотный проект 20 улиц
    volumes:
      - ../dataset:/dataset:ro
    depends_on:
      postgis:
        condition: service_healthy
    entrypoint: ["python", "-m", "greenplan_api.import_pilots"]

  plant-library-import:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    profiles: ["tools"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      GREENPLAN_DATABASE_URL: postgresql://${POSTGIS_USER:-greenplan_domain}:${POSTGIS_PASSWORD:-greenplan_domain_dev_only}@postgis:5432/${POSTGIS_DB:-greenplan_domain}
      PLANT_SYMBOL_DWG: /dataset/Шаблоны значков.dwg
      PLANT_SYMBOL_DXF: /dataset/dxf/Шаблоны значков.dxf
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
    volumes:
      - ../dataset:/dataset:ro
    depends_on:
      postgis:
        condition: service_healthy
    entrypoint: ["python", "-m", "greenplan_api.import_plant_symbols"]

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      FASTAPI_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${WEB_PORT:-38101}:3000"
    depends_on:
      api:
        condition: service_healthy

  laya:
    profiles: ["ai"]
    build:
      context: ..
      dockerfile: platform/laya.Dockerfile
    environment:
      USE_TF: "0"
      HF_HOME: /models/huggingface
      LAYA_MODEL: multilingual
      LAYA_PRELOAD: "1"
      LAYA_MODELS: multilingual
      LAYA_THREADS: ${LAYA_THREADS:-4}
      LAYA_API_KEY: ${LAYA_API_KEY:-greenplan_local_only}
    volumes:
      - ./data/laya-cache:/models/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 180s
    restart: unless-stopped

  semantic-worker:
    profiles: ["ai"]
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      GREENPLAN_DATABASE_URL: postgresql://${POSTGIS_USER:-greenplan_domain}:${POSTGIS_PASSWORD:-greenplan_domain_dev_only}@postgis:5432/${POSTGIS_DB:-greenplan_domain}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      LAYA_URL: http://laya:8000
      LAYA_API_KEY: ${LAYA_API_KEY:-greenplan_local_only}
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
      laya:
        condition: service_healthy
    command: ["celery", "-A", "greenplan_api.semantic_worker:celery", "worker", "--loglevel=INFO", "--queues=semantic", "--hostname=semantic@%h", "--concurrency=1", "--prefetch-multiplier=1"]
    restart: unless-stopped

  llm-runtime:
    profiles: ["ai-next"]
    build:
      context: ..
      dockerfile: platform/llm-runtime.Dockerfile
    environment:
      MODEL_ROOT: /models
      LLM_THREADS: ${LLM_THREADS:-4}
      LLM_CONTEXT_SIZE: ${LLM_CONTEXT_SIZE:-4096}
      LLM_LOAD_TIMEOUT: ${LLM_LOAD_TIMEOUT:-300}
      LLM_REQUEST_TIMEOUT: ${LLM_REQUEST_TIMEOUT:-900}
      LLM_RUNTIME_API_KEY: ${LLM_RUNTIME_API_KEY:-greenplan_local_only}
    volumes:
      - ./data/llm-models:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 10s
    init: true
    stop_grace_period: 30s
    restart: unless-stopped

  decision-orchestrator:
    profiles: ["ai-next"]
    build:
      context: ..
      dockerfile: apps/decision-orchestrator/Dockerfile
    environment:
      LLM_RUNTIME_URL: http://llm-runtime:8080/v1
      LLM_RUNTIME_API_KEY: ${LLM_RUNTIME_API_KEY:-greenplan_local_only}
      ORCHESTRATOR_API_KEY: ${ORCHESTRATOR_API_KEY:-greenplan_local_only}
      SECOND_OPINION_THRESHOLD: ${SECOND_OPINION_THRESHOLD:-0.68}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-256}
    depends_on:
      llm-runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  oda-worker:
    build:
      context: ..
      dockerfile: platform/oda-worker.Dockerfile
    environment: &worker-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-greenplan}:${POSTGRES_PASSWORD:-greenplan_dev_only}@postgres:5432/${POSTGRES_DB:-greenplan}
      DOMAIN_DATABASE_URL: postgresql://${POSTGIS_USER:-greenplan_domain}:${POSTGIS_PASSWORD:-greenplan_domain_dev_only}@postgis:5432/${POSTGIS_DB:-greenplan_domain}
      CELERY_BROKER_URL: redis://redis:6379/0
      DATASET_ROOT: /dataset
      ARCHIVE_ROOT: /archive-extracted
      WORK_ROOT: /work
      EXPORT_ROOT: /exports
      ODA_BIN: /opt/oda/ODAFileConverter
      ODA_TIMEOUT: ${ODA_TIMEOUT:-900}
      LIBREDWG_KEEP_JSON: ${LIBREDWG_KEEP_JSON:-false}
      WORK_KEEP_INPUT: ${WORK_KEEP_INPUT:-false}
      LIBREDWG_VERSION: ${LIBREDWG_VERSION:-0.14}
      INTAKE_ROOT: /intake
    volumes:
      - ../dataset:/dataset:ro
      - ${ARCHIVE_ROOT_HOST_DIR:-/tmp/greenplan-archive-extracted-sol}:/archive-extracted:ro
      - ${WORK_ROOT_HOST_DIR:-./work}:/work
      - ./exports:/exports
      - ./app:/app:ro
      - ./data/intake:/intake
      - ${ODA_RUNTIME_HOST_DIR:?Set absolute path to extracted ODAFileConverter directory}:/opt/oda:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgis:
        condition: service_healthy
    working_dir: /app
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=INFO", "--queues=oda", "--hostname=oda@%h", "--concurrency=2", "--prefetch-multiplier=1"]

  libredwg-worker:
    build:
      context: ..
      dockerfile: platform/libredwg-worker.Dockerfile
    environment: *worker-env
    volumes:
      - ../dataset:/dataset:ro
      - ${ARCHIVE_ROOT_HOST_DIR:-/tmp/greenplan-archive-extracted-sol}:/archive-extracted:ro
      - ${WORK_ROOT_HOST_DIR:-./work}:/work
      - ./app:/app:ro
      - ./data/intake:/intake
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgis:
        condition: service_healthy
    working_dir: /app
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=INFO", "--queues=libredwg", "--hostname=libredwg@%h", "--concurrency=4", "--prefetch-multiplier=1"]

  control:
    build:
      context: ..
      dockerfile: platform/control.Dockerfile
    profiles: ["tools"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment: *worker-env
    volumes:
      # The control command alone materializes verified DXF into per-street dxf/.
      - ../dataset:/dataset
      - ${ARCHIVE_ROOT_HOST_DIR:-/tmp/greenplan-archive-extracted-sol}:/archive-extracted:ro
      - ${WORK_ROOT_HOST_DIR:-./work}:/work
      - ./exports:/exports
      - ./app:/app:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    working_dir: /app
    entrypoint: ["python", "-m", "cli"]
